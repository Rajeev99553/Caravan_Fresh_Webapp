{% extends "base.html" %}
{% block title %}New Visit{% endblock %}
{% block content %}
<h4 class="fw-bold mb-3">Schedule a visit</h4>
<div class="card"><div class="card-body">
  <form method="post">
    <label class="form-label small fw-semibold">Assigned store</label>
    <select name="store_id" class="form-select mb-3" required>
      {% for s in stores %}<option value="{{ s.id }}">{{ s.code }} — {{ s.name }} ({{ s.city }})</option>{% endfor %}
    </select>
    <button class="btn btn-success" style="background:#0f5132;border:none;">Create visit</button>
    <a href="{{ url_for('audit.visits') }}" class="btn btn-link">Cancel</a>
  </form>
</div></div>
{% endblock %}
