{% extends "base.html" %}
{% block title %}Stores{% endblock %}
{% block content %}
<h4 class="fw-bold mb-3">Stores &amp; Officer Assignment</h4>
<div class="card"><div class="card-body p-0"><div class="table-responsive">
  <table class="table align-middle mb-0">
    <thead><tr><th>Code</th><th>Store</th><th>City</th><th>Owner</th><th>Assigned officer</th></tr></thead>
    <tbody>
    {% for s in stores %}
      <tr>
        <td class="fw-semibold">{{ s.code }}</td><td>{{ s.name }}</td><td class="small">{{ s.city }}</td>
        <td class="small">{{ s.owner.name if s.owner else '—' }}</td>
        <td>
          <form method="post" class="d-flex gap-1">
            <input type="hidden" name="store_id" value="{{ s.id }}">
            <select name="officer_id" class="form-select form-select-sm" style="width:170px">
              {% for o in officers %}<option value="{{ o.id }}" {% if s.assigned_officer_id==o.id %}selected{% endif %}>{{ o.name }}</option>{% endfor %}
            </select>
            <button class="btn btn-sm btn-outline-success">Assign</button>
          </form>
        </td>
      </tr>
    {% endfor %}
    </tbody>
  </table>
</div></div></div>
{% endblock %}
