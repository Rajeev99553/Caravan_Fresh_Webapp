{% extends "base.html" %}
{% block title %}KPI Masters{% endblock %}
{% block content %}
<h4 class="fw-bold mb-3">Franchise KPI Masters</h4>
<div class="row g-3">
  <div class="col-lg-7">
    <div class="card"><div class="card-body p-0"><div class="table-responsive">
      <table class="table align-middle mb-0">
        <thead><tr><th>Code</th><th>Name</th><th>Freq</th><th>Weight</th><th>Active</th></tr></thead>
        <tbody>
        {% for k in kpis %}
          <tr class="{% if not k.active %}text-muted{% endif %}">
            <td>{{ k.code }}</td><td>{{ k.name }}<div class="small text-muted">{{ k.description }}</div></td>
            <td>{{ k.frequency }}</td><td>{{ k.weight }}</td>
            <td><form method="post" action="{{ url_for('admin.toggle_kpi', kid=k.id) }}"><button class="btn btn-sm {% if k.active %}btn-success{% else %}btn-outline-secondary{% endif %}">{{ 'On' if k.active else 'Off' }}</button></form></td>
          </tr>
        {% endfor %}
        </tbody>
      </table>
    </div></div></div>
  </div>
  <div class="col-lg-5">
    <div class="card"><div class="card-header">Add KPI</div><div class="card-body">
      <form method="post">
        <input name="code" class="form-control form-control-sm mb-2" placeholder="Code (e.g. KPI-09)" required>
        <input name="name" class="form-control form-control-sm mb-2" placeholder="Name" required>
        <textarea name="description" class="form-control form-control-sm mb-2" placeholder="Description" rows="2"></textarea>
        <div class="row g-2 mb-2">
          <div class="col"><select name="frequency" class="form-select form-select-sm"><option>daily</option><option>weekly</option><option>monthly</option></select></div>
          <div class="col"><input name="weight" type="number" step="0.5" value="1" class="form-control form-control-sm" placeholder="Weight"></div>
        </div>
        <button class="btn btn-success btn-sm" style="background:#0f5132;border:none;">Add KPI</button>
      </form>
    </div></div>
  </div>
</div>
{% endblock %}
