{% extends "base.html" %}
{% block title %}Users{% endblock %}
{% block content %}
<h4 class="fw-bold mb-3">Users</h4>
<div class="card"><div class="card-body p-0"><div class="table-responsive">
  <table class="table align-middle mb-0">
    <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Phone</th><th>Active</th></tr></thead>
    <tbody>
    {% for u in users %}
      <tr>
        <td class="fw-semibold">{{ u.name }}</td><td class="small">{{ u.email }}</td>
        <td><span class="badge bg-light text-dark border">{{ labels.get(u.role, u.role) }}</span></td>
        <td class="small">{{ u.phone or '—' }}</td>
        <td>{% if u.active %}<i class="bi bi-check-circle-fill text-success"></i>{% else %}<i class="bi bi-x-circle text-muted"></i>{% endif %}</td>
      </tr>
    {% endfor %}
    </tbody>
  </table>
</div></div></div>
{% endblock %}
